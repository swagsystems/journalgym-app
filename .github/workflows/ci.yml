name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked backend dependencies and validate direct pins
        run: python -m pip install --require-hashes -r requirements.lock -r requirements.txt
      - run: python -m pip install pip-audit
      - run: python -m unittest discover -s tests
      - run: python -c "import api.main"
      - run: pip-audit -r requirements.lock --progress-spinner off
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run test:drafts
      - working-directory: frontend
        run: npm run test:bulk
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npm audit --audit-level=moderate
